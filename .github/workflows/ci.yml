name: ci

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        node: ['20', '22']

    defaults:
      run:
        working-directory: server

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}
          cache: npm
          cache-dependency-path: server/package-lock.json

      # `npm ci` triggers the prepare script, which compiles the server.
      - run: npm ci

      - name: Typecheck
        run: npm run typecheck

      # Browser-free. Asserts the auditor still separates a slop fixture from a
      # designed one — if that gap closes, the tool has stopped being useful.
      - name: Self test
        run: npm test

  smoke:
    runs-on: ubuntu-latest
    needs: build

    defaults:
      run:
        working-directory: server

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: server/package-lock.json

      - run: npm ci

      - name: Install Chromium
        run: npx playwright install --with-deps chromium

      - name: End-to-end audit
        run: npm run smoke
