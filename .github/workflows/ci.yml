name: ci

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        node: ['20', '22']

    defaults:
      run:
        working-directory: server

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: ${{ matrix.node }}
          cache: npm
          cache-dependency-path: server/package-lock.json

      # `npm ci` triggers the prepare script, which compiles the server.
      - run: npm ci

      - name: Typecheck
        run: npm run typecheck

      # Browser-free. Asserts the auditor still separates a slop fixture from a
      # designed one — if that gap closes, the tool has stopped being useful.
      - name: Self test
        run: npm test

  # setup.ps1 is parsed by Windows PowerShell 5.1, whose quirks (ANSI decoding
  # without a BOM, smart quotes acting as string delimiters) are not reproducible
  # anywhere else. Check it with the parser that actually runs it.
  script:
    runs-on: windows-latest

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Parse setup.ps1
        shell: powershell
        run: |
          $errors = $null
          [System.Management.Automation.Language.Parser]::ParseFile(
            "$env:GITHUB_WORKSPACE\setup.ps1", [ref]$null, [ref]$errors) | Out-Null
          if ($errors) {
            $errors | ForEach-Object { Write-Host $_.Message -ForegroundColor Red }
            exit 1
          }
          Write-Host 'setup.ps1 parses clean'

      - name: Enforce ASCII-only and a UTF-8 BOM
        shell: powershell
        run: |
          $bytes = [System.IO.File]::ReadAllBytes("$env:GITHUB_WORKSPACE\setup.ps1")
          if ($bytes[0] -ne 0xEF -or $bytes[1] -ne 0xBB -or $bytes[2] -ne 0xBF) {
            Write-Host 'setup.ps1 is missing its UTF-8 BOM' -ForegroundColor Red
            exit 1
          }
          $offenders = @($bytes[3..($bytes.Length - 1)] | Where-Object { $_ -gt 127 })
          if ($offenders.Count -gt 0) {
            Write-Host "setup.ps1 has $($offenders.Count) non-ASCII bytes" -ForegroundColor Red
            exit 1
          }
          Write-Host 'setup.ps1 is ASCII-only with a BOM'

  smoke:
    runs-on: ubuntu-latest
    needs: build

    defaults:
      run:
        working-directory: server

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: server/package-lock.json

      - run: npm ci

      - name: Install Chromium
        run: npx playwright install --with-deps chromium

      - name: End-to-end audit
        run: npm run smoke
